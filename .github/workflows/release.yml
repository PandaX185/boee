name: Attach release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach assets to (e.g. boee-v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.tag != ''
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist-web
      - run: zip -r web-build.zip dist-web
      - run: gh release upload "$TAG" web-build.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    name: Android APK (EAS)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > /tmp/eas-build.json
      - name: Attach APK to release
        if: env.TAG != ''
        run: |
          ARTIFACT_URL=$(node -p "require('/tmp/eas-build.json')[0].artifacts.applicationArchiveUrl")
          curl -sSL "$ARTIFACT_URL" -o "boee-${TAG}.apk"
          gh release upload "$TAG" "boee-${TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Link EAS build in release notes
        if: env.TAG != ''
        run: |
          BUILD_URL=$(node -p "require('/tmp/eas-build.json')[0].artifacts.buildUrl")
          gh release view "$TAG" --json body --jq .body > /tmp/notes.md
          printf '\nAndroid APK built with EAS: %s\n' "$BUILD_URL" >> /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
